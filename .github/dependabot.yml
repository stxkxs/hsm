version: 2

# Keeps the four dependency surfaces current so security advisories surface as PRs
# instead of accumulating silently in the Dependabot alert list. Rust and npm updates
# are grouped so a maintenance pass is one review, not thirty.
updates:
  # Rust workspace (23 crates, one shared Cargo.lock)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-patch-and-minor:
        update-types: ["minor", "patch"]
    ignore:
      # Blocked by trait/ecosystem coupling — the RustCrypto digest 0.11 /
      # crypto-common 0.2 wave cannot be taken piecemeal while aes-gcm 0.10,
      # {k,p}256/p384 0.13, ed25519-dalek 2.x and rsa 0.9 still pin digest 0.10.
      # Bumping any one of these creates duplicate, incoherent trait generations.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sha3"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "aes-gcm"
        update-types: ["version-update:semver-minor"]
      # rand 0.9+/rand_core 0.9+ break every RNG-into-crypto call site, because the
      # crypto stack pins rand_core 0.6 CryptoRng via elliptic-curve 0.13.
      - dependency-name: "rand"
      - dependency-name: "rand_core"
      - dependency-name: "rand_chacha"
      # Attempted and reverted — see docs and .cargo/audit.toml for rationale.
      - dependency-name: "z3"          # 0.13+ removed the 'ctx lifetime; full rewrite of 7 SMT encoders
      - dependency-name: "reqwest"     # 0.13 dropped the `json` and `rustls-tls` features
      - dependency-name: "sev"         # 8.x pulls rdrand 0.8, x86-only intrinsics
      - dependency-name: "dudect-bencher" # 0.7 breaks the rand 0.8 API in timing_tests.rs

  # Next.js dashboard
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-patch-and-minor:
        update-types: ["minor", "patch"]
      radix-ui:
        patterns: ["@radix-ui/*"]
    ignore:
      # eslint-config-next 16 bundles eslint-plugin-react, which calls the
      # context.getFilename() API removed in eslint 10 — eslint 10 crashes on it.
      - dependency-name: "eslint"
        versions: [">=10"]
      # TypeScript 7 (the native-Go rewrite) is not usable here yet: no published
      # typescript-eslint supports it (peer range <6.1.0) and eslint-config-next 16
      # pins typescript-eslint, so `npm run lint` dies at module load; `next build`
      # separately rejects it, wanting the TS 6 compiler API. Minor/patch 6.x still
      # flows. Revisit when typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # TypeScript client SDK
  - package-ecosystem: npm
    directory: "/sdks/typescript"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sdk-patch-and-minor:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 ships no JavaScript compiler API — require('typescript') exposes
      # only {version, versionMajorMinor}, so tsup's --dts step crashes inside
      # rollup-plugin-dts. `tsc --noEmit` DOES pass, so src/ is TS 7-ready; the build
      # toolchain is not. Revisit when tsup/rollup-plugin-dts support TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # CI action versions — these drifted 1-3 majors behind before this file existed.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        exclude-patterns: ["dtolnay/rust-toolchain"]
    ignore:
      # NOT an action version. `dtolnay/rust-toolchain@1.97` selects the Rust
      # toolchain, and that ref must stay equal to the MSRV declared in
      # rust-toolchain.toml / Dockerfile / README — the `msrv` job exists precisely
      # to compile against that floor. Dependabot version-sorts the action's refs
      # (1.100 > 1.97) and proposed a Rust release that does not exist; taking it
      # would leave the msrv job silently not testing the MSRV. Raise this pin by
      # hand, together with the other MSRV references, whenever MSRV moves.
      - dependency-name: "dtolnay/rust-toolchain"

  # Builder/runtime base images in the multi-stage Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
