name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  Z3_SYS_Z3_HEADER: /usr/include/z3.h

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev libclang-dev
    - name: Run tests (excluding performance/stress/chaos tests)
      run: |
        cargo test --all -- \
          --skip performance \
          --skip throughput \
          --skip stress \
          --skip high_concurrency \
          --skip large_chain \
          --skip batch_operations \
          --skip workload
    - name: Run clippy
      run: cargo clippy --all -- -D warnings
    - name: Check formatting
      run: cargo fmt --all -- --check

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Security audit
      run: cargo audit --ignore RUSTSEC-2025-0055
