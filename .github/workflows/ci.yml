name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  Z3_SYS_Z3_HEADER: /usr/include/z3.h
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hsm-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev libclang-dev
    - name: Run tests (excluding performance/stress/chaos tests)
      run: |
        cargo test --all -- \
          --skip performance \
          --skip throughput \
          --skip stress \
          --skip high_concurrency \
          --skip large_chain \
          --skip batch_operations \
          --skip workload
    - name: Run clippy
      run: cargo clippy --all -- -D warnings
    - name: Check formatting
      run: cargo fmt --all -- --check

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Security audit
      run: |
        # Policy: fail the build on security-relevant advisories only — VULNERABILITIES
        # (denied by default) and UNSOUND advisories — while treating purely
        # informational notices (unmaintained, yanked) as non-fatal warnings.
        #
        # `--deny warnings` was unsustainable here: the RustSec advisory DB updates
        # continuously, so any newly published unmaintained/yanked notice anywhere in
        # the large transitive dependency tree would fail the build (and block the
        # container publish) no matter how large the --ignore list grew. There are
        # currently zero vulnerabilities in the tree; the only failures were such
        # informational notices. We still hard-fail on real vulnerabilities + unsound.
        cargo audit --deny unsound \
          --ignore RUSTSEC-2026-0049 \
          --ignore RUSTSEC-2026-0098 \
          --ignore RUSTSEC-2026-0099 \
          --ignore RUSTSEC-2026-0104 \
          --ignore RUSTSEC-2021-0145 \
          --ignore RUSTSEC-2026-0097
        # Ignored advisories — only vulnerability/unsound-type entries that are not
        # applicable here (unmaintained/yanked notices are NOT denied, so need no ignore):
        # RUSTSEC-2026-0049/0098/0099/0104: rustls-webpki 0.101.7 CRL-matching vulnerability —
        #   reachable only via the optional aws-nitro feature chain (aws-smithy-http-client).
        #   The HSM's own TLS uses rustls-webpki 0.103.13, which IS patched.
        # RUSTSEC-2021-0145: atty potential unaligned read (unsound) — via clap 2 -> dudect-bencher (dev-dep only).
        # RUSTSEC-2026-0097: rand 0.10 unsound with a custom global logger — via quickcheck (grpc-api dev-dep only;
        #   the HSM never installs a custom rand logger).

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.93
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev libclang-dev
    - name: Check MSRV
      run: cargo check --all

  container:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=raw,value=latest
    - name: Build and push container image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
