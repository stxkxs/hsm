name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  Z3_SYS_Z3_HEADER: /usr/include/z3.h
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hsm-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev libclang-dev
    - name: Run tests (excluding performance/stress/chaos tests)
      run: |
        cargo test --all -- \
          --skip performance \
          --skip throughput \
          --skip stress \
          --skip high_concurrency \
          --skip large_chain \
          --skip batch_operations \
          --skip workload
    - name: Run clippy
      run: cargo clippy --all -- -D warnings
    - name: Lint and test the experimental-chains feature
      # The Aptos/Sui/NEAR modules are gated off by default; exercise them here so
      # the gated code and its tests do not bit-rot.
      run: |
        cargo clippy -p hsm-blockchain --features experimental-chains --all-targets -- -D warnings
        cargo test -p hsm-blockchain --features experimental-chains
    - name: Lint and test the hardware feature (TEE key manager)
      # The hardware-backed key manager (and hsm-storage's hardware path) is gated
      # off by default; exercise the base `hardware` feature here so it cannot
      # silently stop compiling again. The cloud-backend sub-features
      # (aws-nitro/intel-sgx/amd-sev) pull heavier deps and are out of scope.
      run: |
        cargo clippy -p hsm-key-manager --features hardware --all-targets -- -D warnings
        cargo test -p hsm-key-manager --features hardware
    - name: Check formatting
      run: cargo fmt --all -- --check

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Security audit
      run: |
        # Policy: fail the build on security-relevant advisories only — VULNERABILITIES
        # (denied by default) and UNSOUND advisories — while treating purely
        # informational notices (unmaintained, yanked) as non-fatal warnings.
        #
        # `--deny warnings` was unsustainable here: the RustSec advisory DB updates
        # continuously, so any newly published unmaintained/yanked notice anywhere in
        # the large transitive dependency tree would fail the build (and block the
        # container publish) no matter how large the --ignore list grew. There are
        # currently zero vulnerabilities in the tree; the only failures were such
        # informational notices. We still hard-fail on real vulnerabilities + unsound.
        cargo audit --deny unsound \
          --ignore RUSTSEC-2026-0049 \
          --ignore RUSTSEC-2026-0098 \
          --ignore RUSTSEC-2026-0099 \
          --ignore RUSTSEC-2026-0104 \
          --ignore RUSTSEC-2021-0145 \
          --ignore RUSTSEC-2026-0097
        # Ignored advisories — only vulnerability/unsound-type entries that are not
        # applicable here (unmaintained/yanked notices are NOT denied, so need no ignore):
        # RUSTSEC-2026-0049/0098/0099/0104: rustls-webpki 0.101.7 CRL-matching vulnerability —
        #   reachable only via the optional aws-nitro feature chain (aws-smithy-http-client).
        #   The HSM's own TLS uses rustls-webpki 0.103.13, which IS patched.
        # RUSTSEC-2021-0145: atty potential unaligned read (unsound) — via clap 2 -> dudect-bencher (dev-dep only).
        # RUSTSEC-2026-0097: rand 0.10 unsound with a custom global logger — via quickcheck (grpc-api dev-dep only;
        #   the HSM never installs a custom rand logger).

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@1.100
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev libclang-dev
    - name: Check MSRV
      run: cargo check --all

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Type-check
      run: npm run type-check
    - name: Build
      run: npm run build

  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: sdks/typescript/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Type-check
      run: npm run typecheck
    - name: Build
      run: npm run build
    - name: Test
      run: npm test

  container:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=raw,value=latest
    - name: Build and push container image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
