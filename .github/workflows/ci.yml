name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  Z3_SYS_Z3_HEADER: /usr/include/z3.h
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hsm-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev libclang-dev
    - name: Run tests (excluding performance/stress/chaos tests)
      run: |
        cargo test --all -- \
          --skip performance \
          --skip throughput \
          --skip stress \
          --skip high_concurrency \
          --skip large_chain \
          --skip batch_operations \
          --skip workload
    - name: Run clippy
      run: cargo clippy --all -- -D warnings
    - name: Check formatting
      run: cargo fmt --all -- --check

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Security audit
      run: |
        cargo audit --deny warnings \
          --ignore RUSTSEC-2024-0436 \
          --ignore RUSTSEC-2024-0388 \
          --ignore RUSTSEC-2025-0057 \
          --ignore RUSTSEC-2021-0127 \
          --ignore RUSTSEC-2026-0049 \
          --ignore RUSTSEC-2026-0098 \
          --ignore RUSTSEC-2026-0099 \
          --ignore RUSTSEC-2026-0104 \
          --ignore RUSTSEC-2021-0139 \
          --ignore RUSTSEC-2021-0145 \
          --ignore RUSTSEC-2024-0375 \
          --ignore RUSTSEC-2024-0384 \
          --ignore RUSTSEC-2026-0097
        # Ignored advisories (unmaintained transitive deps with no fix available):
        # RUSTSEC-2024-0436: paste - via ark-ff/pqcrypto-mldsa
        # RUSTSEC-2024-0388: derivative - via ark-ff
        # RUSTSEC-2025-0057: fxhash - via sled
        # RUSTSEC-2021-0127: serde_cbor - via aws-nitro-enclaves-cose (optional)
        # RUSTSEC-2026-0049: rustls-webpki 0.101.7 - via aws-smithy-http-client (CRL matching bug, no fix until AWS SDK updates)
        # RUSTSEC-2026-0098/0099/0104: rustls-webpki 0.101.7 - same chain as above (aws-nitro optional feature only). HSM TLS uses rustls-webpki 0.103.13 which IS patched.
        # RUSTSEC-2021-0139: ansi_term unmaintained - via clap 2 -> dudect-bencher (dev-dep only, crypto-engine timing tests)
        # RUSTSEC-2024-0375 / RUSTSEC-2021-0145: atty unmaintained / unaligned read - via clap 2 -> dudect-bencher (dev-dep only)
        # RUSTSEC-2024-0384: instant unmaintained - via parking_lot 0.11 -> sled (storage/cluster/validator)
        # RUSTSEC-2026-0097: rand 0.10 unsound with custom global logger - via quickcheck (grpc-api dev-dep only, HSM doesn't install a custom rand logger)

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.93
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libz3-dev libclang-dev
    - name: Check MSRV
      run: cargo check --all

  container:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=raw,value=latest
    - name: Build and push container image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
