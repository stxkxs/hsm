name: MIRI Memory Safety Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  Z3_SYS_Z3_HEADER: ""  # Unset macOS path

jobs:
  miri:
    name: MIRI Undefined Behavior Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Setup Miri
        run: cargo miri setup

      - name: Run MIRI tests on crypto-engine
        run: |
          cd crates/crypto-engine
          cargo +nightly miri test --lib
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"

      - name: Run MIRI tests on key-manager
        run: |
          cd crates/key-manager
          cargo +nightly miri test --lib
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        continue-on-error: true  # Key-manager might have external dependencies

      - name: Run MIRI tests on storage
        run: |
          cd crates/storage
          cargo +nightly miri test --lib
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        continue-on-error: true

      - name: Run MIRI tests on auth
        run: |
          cd crates/auth
          cargo +nightly miri test --lib
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        continue-on-error: true

      - name: Run MIRI tests on audit
        run: |
          cd crates/audit
          cargo +nightly miri test --lib
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        continue-on-error: true

      - name: Run MIRI tests on backup
        run: |
          cd crates/backup
          cargo +nightly miri test --lib
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        continue-on-error: true

  miri-summary:
    name: MIRI Test Summary
    runs-on: ubuntu-latest
    needs: miri
    if: always()

    steps:
      - name: Check MIRI results
        run: |
          echo "MIRI memory safety tests completed"
          echo "Check individual job results for undefined behavior warnings"
