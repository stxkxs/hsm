[package]
name = "hsm-blockchain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Blockchain-specific cryptographic operations for HSM"

[features]
default = []
# Experimental, beyond-spec chains (Aptos, Sui, NEAR) whose transaction
# serialization is NOT yet canonical/chain-compatible. Signatures produced over
# these encodings are not guaranteed to verify on the respective networks, so
# the modules are gated off by default. Do not enable in production until
# canonical encoders land.
experimental-chains = []

[dependencies]
# HD key derivation
bip32 = "0.5"
bip39 = { version = "2.2", features = ["rand"] }

# Ethereum support
alloy-primitives = { version = "1", features = ["rlp"] }
alloy-rlp = "0.3"
tiny-keccak = { version = "2.0", features = ["keccak"] }

# Bitcoin support
bitcoin = { version = "0.32", features = ["std", "secp-recovery"] }

# StarkNet support
starknet-crypto = "0.8"
# Exposes NonZeroFelt + Felt::mod_floor for canonical StarkNet contract-address
# normalization (the Felt type unifies with the one re-exported by
# starknet-crypto, which depends on the same starknet-types-core 0.2.x).
starknet-types-core = { version = "0.2", default-features = false, features = ["curve", "hash"] }

# Cryptographic primitives
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
sha2.workspace = true
sha3 = "0.10"
# RIPEMD-160 for Cosmos HASH160 address derivation
ripemd = "0.2"
# Blake2b-512 for SS58 (Substrate/Polkadot) address checksums
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
ed25519-dalek.workspace = true

# Base58 encoding (for Solana, Cosmos)
bs58.workspace = true

# Bech32 encoding (for Cosmos)
bech32 = "0.12"

# Base64 encoding
base64 = "0.23"

# Security
secrecy.workspace = true
zeroize.workspace = true

# Serialization
serde.workspace = true
# arbitrary_precision is required so that large EIP-712 integer literals (e.g.
# wei amounts above u64::MAX) survive JSON parsing without being lossily coerced
# into an f64. With this feature, serde_json::Number preserves the exact decimal
# digits, which encode_int parses into a 256-bit value.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
hex = "0.4"

# Error handling
thiserror.workspace = true

# Utilities
rand = "0.8"
getrandom.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest = "1"

[[bench]]
name = "blockchain_bench"
harness = false
