[package]
name = "hsm-pkcs11"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PKCS#11 bridge for HSM - allows legacy applications to use HSM via standard PKCS#11 interface"

[lib]
crate-type = ["cdylib", "rlib"]  # cdylib for shared library, rlib for testing

[dependencies]
# HSM crypto operations (for local signing backend)
hsm-crypto-engine = { path = "../crypto-engine" }

# Ed25519 for key derivation
ed25519-dalek = { version = "2.2", features = ["rand_core"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

# Concurrency
parking_lot = { workspace = true }
dashmap = "6.1"
once_cell = "1.20"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }

[dev-dependencies]
# Testing
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
