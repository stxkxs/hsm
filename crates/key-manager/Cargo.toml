[package]
name = "hsm-key-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Crypto engine (our module)
hsm-crypto-engine = { path = "../crypto-engine" }

# Blockchain HD wallet support
hsm-blockchain = { path = "../blockchain" }

# BIP-32 extended key reconstruction (faithful XPrv rebuild from stored
# private-key + chain-code components, used by HD child derivation)
bip32 = { version = "0.5", default-features = false, features = ["alloc", "secp256k1"] }

# Cryptographic primitives for key import
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa"] }
blst = "0.3"
rsa = "0.9"

# Security
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"

# Concurrency
tokio = { version = "1.53", features = ["sync", "rt", "macros"] }
parking_lot = "0.12"
dashmap = "6.2"
lru = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
postcard = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for key IDs
uuid = { version = "1.24", features = ["v4", "serde"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# SHA-256 + RIPEMD-160 for BIP-32 HASH160 fingerprints
sha2 = "0.10"
ripemd = "0.1"

# Encrypted persistent storage (software backend always available; the optional
# `hardware` feature additionally enables hsm-storage's TEE-sealed backend).
hsm-storage = { path = "../storage" }
hsm-hardware-backend = { path = "../hardware-backend", optional = true }

# Async trait support
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["full", "test-util"] }
proptest = "1.11"
criterion = "0.8"
# Capturing tracing ERROR events to prove delete_key no longer error-logs
tracing-subscriber = { version = "0.3", features = ["registry"] }

[[bench]]
name = "key_manager_benches"
harness = false

[features]
default = []
hardware = ["hsm-storage/hardware", "hsm-hardware-backend", "async-trait"]
aws-nitro = ["hardware", "hsm-storage/aws-nitro", "hsm-hardware-backend/aws-nitro"]
intel-sgx = ["hardware", "hsm-storage/intel-sgx", "hsm-hardware-backend/intel-sgx"]
amd-sev = ["hardware", "hsm-storage/amd-sev", "hsm-hardware-backend/amd-sev"]
all-hardware = ["hardware", "hsm-storage/all-hardware", "hsm-hardware-backend/all-backends"]
