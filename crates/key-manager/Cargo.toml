[package]
name = "hsm-key-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Crypto engine (our module)
hsm-crypto-engine = { path = "../crypto-engine" }

# Security
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"

# Concurrency
tokio = { version = "1.49", features = ["sync", "rt", "macros"] }
parking_lot = "0.12"
dashmap = "6.1"
lru = "0.16"

# Serialization
serde = { version = "1.0", features = ["derive"] }
postcard = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for key IDs
uuid = { version = "1.19", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# SHA-256 for fingerprints
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.49", features = ["full", "test-util"] }
proptest = "1.9"
criterion = "0.8"

[[bench]]
name = "key_manager_benches"
harness = false
