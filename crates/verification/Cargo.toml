[package]
name = "hsm-verification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# SMT solvers for formal verification
# NOTE: Requires Z3 to be installed on the system
# Install with: brew install z3 (macOS) or apt-get install z3 (Linux)
# Or download from: https://github.com/Z3Prover/z3/releases
z3 = "0.12"

# Crypto dependencies (for property verification)
ed25519-dalek = "2.2"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = "0.9"
sha2 = "0.10"
curve25519-dalek = "4.1"

# Mathematical operations
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# For Shamir's Secret Sharing verification
sharks = "0.5"

# Utilities
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Testing utilities
proptest = "1.9"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"

[[bench]]
name = "verification_benches"
harness = false
