[package]
name = "hsm-validator"
version = "0.1.0"
edition = "2021"
description = "Validator key management with anti-slashing protection for Ethereum and Babylon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hsm/hsm"
keywords = ["hsm", "validator", "ethereum", "staking", "anti-slashing"]
categories = ["cryptography", "authentication"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Cryptographic primitives
blst = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"

# Database
sled = "0.34"

# Concurrent access
parking_lot = "0.12"
dashmap.workspace = true

# Misc
uuid.workspace = true
bytes = "1.5"
getrandom = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
proptest = "1.4"
criterion.workspace = true

[[bench]]
name = "anti_slashing"
harness = false

[features]
default = []
# Enable Babylon EOTS support
babylon = []
# Enable all validator features
full = ["babylon"]
