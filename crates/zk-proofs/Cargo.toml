[package]
name = "zk-proofs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Core dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

# ZK proof libraries - using arkworks ecosystem for flexibility
# Note: ark-relations is patched at workspace level to remove tracing-subscriber
# dependency (RUSTSEC-2025-0055 - ANSI escape injection vulnerability)
ark-ff = "0.5"
ark-ec = "0.5"
ark-std = "0.5"
ark-poly = "0.5"
ark-serialize = "0.5"
ark-relations = "0.5"  # R1CS constraints (patched at workspace level)
ark-bn254 = "0.5"  # BN254 curve for efficient pairings
ark-groth16 = "0.5"  # Groth16 SNARK
ark-snark = "0.5"  # SNARK trait
ark-crypto-primitives = "0.5"

# Polynomial commitments for Lasso-style lookups
ark-poly-commit = "0.5"

# Cryptographic primitives
blake2 = "0.10"  # Fast hash function
rand = "0.8"
rand_chacha = "0.3"

# Utilities
parking_lot = "0.12"
rayon = "1.10"  # Parallel proof generation
chrono = "0.4"  # Time handling

# Audit integration
audit = { path = "../audit" }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.24"
proptest = "1.6"

[[bench]]
name = "zk_benchmarks"
harness = false
