[package]
name = "hsm-zk-proofs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
# WARNING: The Lasso lookup argument in `lasso.rs` is NOT cryptographically
# sound. Its "sumcheck" is a placeholder (`claimed_sum == 0`) with no real
# polynomial-commitment opening verification, so forged proofs would be
# accepted. `LookupArgument::verify` therefore fails closed (returns an error)
# unless this non-default feature is explicitly enabled, and even then it must
# only be used for research/benchmarking — never to make a security decision.
experimental-lasso = []

[dependencies]
# Core dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

# ZK proof libraries - arkworks ecosystem (0.6).
# 0.6 uses the gr1cs (generalized R1CS) constraint API — R1CS constraints are
# enforced via ConstraintSystemRef::enforce_r1cs_constraint (see merkle_proof.rs /
# event_proof.rs). It also pulls tracing-subscriber 0.3 (optional, off by default)
# rather than the vulnerable 0.2.x, so the former local ark-relations patch for
# RUSTSEC-2025-0055 is no longer needed and has been removed.
ark-ff = "0.6"
ark-ec = "0.6"
ark-std = "0.6"
ark-poly = "0.6"
ark-serialize = "0.6"
ark-relations = "0.6"  # gr1cs constraint system
ark-bn254 = "0.6"  # BN254 curve for efficient pairings
ark-groth16 = "0.6"  # Groth16 SNARK
ark-snark = "0.6"  # SNARK trait
ark-crypto-primitives = "0.6"

# Polynomial commitments for Lasso-style lookups
ark-poly-commit = "0.6"

# Cryptographic primitives
blake2 = "0.10"  # Fast hash function
rand = "0.8"
rand_chacha = "0.3"

# Utilities
parking_lot = "0.12"
rayon = "1.10"  # Parallel proof generation
chrono = "0.4"  # Time handling

# Audit integration
hsm-audit = { path = "../audit" }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.24"
proptest = "1.6"

[[bench]]
name = "zk_benchmarks"
harness = false
