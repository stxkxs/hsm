[package]
name = "hsm-rest-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "REST/JSON API Gateway for HSM"

[dependencies]
# HTTP Server
axum = { version = "0.8", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "timeout"] }
hyper = { version = "1.11", features = ["full"] }
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# HSM dependencies
hsm-auth = { path = "../auth" }
hsm-audit = { path = "../audit" }
hsm-crypto-engine = { path = "../crypto-engine" }
hsm-key-manager = { path = "../key-manager" }
hsm-webhooks = { path = "../webhooks" }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and metrics
tracing = "0.1"
metrics = "0.24"

# Utilities
uuid = { version = "1.24", features = ["v4", "serde"] }
hex = "0.4"
base64 = "0.23"
chrono = { workspace = true }
getrandom.workspace = true
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
hsm-audit = { path = "../audit" }
tempfile = "3"
