[package]
name = "hsm-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# TLS
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true

# Async
tokio = { workspace = true, features = ["sync", "rt"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono.workspace = true

# Utilities
thiserror.workspace = true
parking_lot.workspace = true
pem = "4.0"

# Performance & Caching
lru = "0.18"
dashmap = "6.2"

# Permissions
bitflags = "2.13"

# Rate Limiting
governor = "0.10"

# Cryptography
rand = "0.8"
sha1 = "0.11"  # SHA1 for TOTP (RFC 6238)
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"  # Constant-time operations for cryptographic comparisons
zeroize = { version = "1.9", features = ["derive"] }  # Secure memory zeroization
base64 = "0.23"  # Base64 encoding for JWT
ciborium = "0.2"  # CBOR decoding for WebAuthn COSE keys / attestation objects
hmac.workspace = true  # HMAC for webhook signatures
rsa = { workspace = true }  # RSA signature verification for JWT
p256 = { workspace = true, features = ["ecdsa"] }  # ECDSA P-256 for JWT ES256
p384 = { workspace = true, features = ["ecdsa"] }  # ECDSA P-384 for JWT ES384
ring.workspace = true  # Cryptographic signature verification for mTLS

# OIDC support
reqwest.workspace = true
uuid = { version = "1.24", features = ["v4", "serde"] }  # UUIDs for policy IDs
url = "2.5"  # URL parsing for OAuth
getrandom.workspace = true  # Secure random for OAuth state

# Circuit Breaker
failsafe = "1.3"

# Logging
tracing.workspace = true

# Metrics (for performance monitoring)
metrics = "0.24"

[dev-dependencies]
rcgen = "0.14"  # For generating test certificates
criterion = "0.8"  # For benchmarking
proptest = "1.11"  # For property-based testing

# Benchmarks
[[bench]]
name = "auth_benchmarks"
harness = false
