[package]
name = "hsm-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# TLS
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
webpki.workspace = true

# Async
tokio = { workspace = true, features = ["sync", "rt"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono.workspace = true

# Utilities
thiserror.workspace = true
parking_lot.workspace = true
pem = "3.0"

# Performance & Caching
lru = "0.16"
dashmap = "6.1"

# Permissions
bitflags = "2.10"

# Rate Limiting
governor = "0.10"

# Cryptography
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"  # Constant-time operations for cryptographic comparisons
zeroize = { version = "1.8", features = ["derive"] }  # Secure memory zeroization
base64 = "0.22"  # Base64 encoding for JWT
hmac.workspace = true  # HMAC for webhook signatures

# OIDC support
reqwest.workspace = true
uuid = { version = "1.13", features = ["v4", "serde"] }  # UUIDs for policy IDs

# Circuit Breaker
failsafe = "1.3"

# Metrics (for performance monitoring)
metrics = "0.24"

[dev-dependencies]
rcgen = "0.14"  # For generating test certificates
criterion = "0.8"  # For benchmarking
proptest = "1.6"  # For property-based testing

# Benchmarks
[[bench]]
name = "auth_benchmarks"
harness = false
