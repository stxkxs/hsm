[package]
name = "hsm-crypto-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Core crypto
ed25519-dalek = { version = "2.2", features = ["rand_core", "batch"] }
curve25519-dalek = "4.1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
rand_core = "0.6"
pkcs8 = "0.10"
pkcs1 = "0.7"

# Hashing
sha2 = "0.10"
sha3 = "0.10"

# KDF
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
argon2 = "0.5"

# Security
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.2"
subtle = "2.6"

# Error handling
thiserror = "2.0"

# Serialization (for key formats)
serde = { version = "1.0", features = ["derive"] }

# Parallelism
rayon = "1.11"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
serde_json = "1.0"
proptest = "1.9"
dudect-bencher = "0.5"
clap = "2.34"  # Required by dudect-bencher's ctbench_main! macro

[[bench]]
name = "crypto_benches"
harness = false
