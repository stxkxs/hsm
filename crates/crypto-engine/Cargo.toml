[package]
name = "hsm-crypto-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Core crypto
ed25519-dalek = { version = "2.2", features = ["rand_core", "batch"] }
curve25519-dalek = "4.1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
rsa = { version = "0.9", features = ["sha2"] }

# BLS signatures (Ethereum 2.0)
blst = "0.3"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
rand_core = "0.6"
pkcs8 = "0.10"
pkcs1 = "0.7"

# Hashing
sha2 = "0.10"
sha3 = "0.10"

# KDF
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
argon2 = "0.5"

# Security
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.2"
subtle = "2.6"

# FIPS compliance
hmac = "0.12"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"

# Big integer math for blind signatures
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"

# Error handling
thiserror = "2.0"

# Logging and metrics
tracing = "0.1"
metrics = "0.24"

# Serialization (for key formats)
serde = { version = "1.0", features = ["derive"] }

# Threshold cryptography (FROST)
frost-ed25519 = "2.2"
frost-core = "2.2"

# Parallelism
rayon = "1.11"
# Post-quantum cryptography (NIST FIPS 203/204 standardized)
pqcrypto-mlkem = "0.1"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3.5"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
serde_json = "1.0"
proptest = "1.9"
dudect-bencher = "0.6"

[[bench]]
name = "crypto_benches"
harness = false

[[bench]]
name = "threshold_bench"
harness = false
