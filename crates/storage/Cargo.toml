[package]
name = "hsm-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
hmac = "0.12"
subtle = "2.6"  # Constant-time operations for cryptographic comparisons

# Serialization
serde = { version = "1.0", features = ["derive"] }
postcard = { workspace = true }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Filesystem utilities
tempfile = "3.24"

# Async runtime
tokio = { version = "1.49", features = ["fs", "io-util", "rt", "sync", "macros"] }
futures = "0.3"
async-trait = "0.1"

# Caching
lru = "0.16"
dashmap = "6.1"
parking_lot.workspace = true

# Compression
zstd = "0.13"

# Sharding
seahash = "4.1"

# Hardware backends (optional)
hsm-hardware-backend = { path = "../hardware-backend", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
proptest = "1.9"
tokio-test = "0.4"
serde_json = "1.0"
chrono = "0.4"

[features]
default = []
hardware = ["hsm-hardware-backend"]
aws-nitro = ["hardware", "hsm-hardware-backend/aws-nitro"]
intel-sgx = ["hardware", "hsm-hardware-backend/intel-sgx"]
amd-sev = ["hardware", "hsm-hardware-backend/amd-sev"]
all-hardware = ["hardware", "hsm-hardware-backend/all-backends"]
