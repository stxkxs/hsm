[package]
name = "hsm-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
hmac = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
postcard = { workspace = true }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Filesystem utilities
tempfile = "3.24"

# Async runtime
tokio = { version = "1.49", features = ["fs", "io-util", "rt", "sync", "macros"] }
futures = "0.3"

# Caching
lru = "0.16"
dashmap = "6.1"

# Compression
zstd = "0.13"

# Sharding
seahash = "4.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
proptest = "1.9"
tokio-test = "0.4"
