[package]
name = "hsm-grpc-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "serde"] }

# Performance enhancements
lru = "0.18"
dashmap = "6.2"
parking_lot = "0.12"

# Security and reliability
tonic-health = "0.14"
tonic-web = "0.14"  # gRPC-Web support for browser clients
tower-http = { version = "0.7", features = ["cors"] }
http = "1.5"
async-trait = "0.1"

# HSM dependencies
hsm-crypto-engine = { path = "../crypto-engine" }
hsm-key-manager = { path = "../key-manager" }
hsm-auth = { path = "../auth" }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1.11"
quickcheck = "1.1"
arbitrary = { version = "1.4", features = ["derive"] }

[[bench]]
name = "grpc_benchmarks"
harness = false
