[package]
name = "hsm-hardware-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { workspace = true }

# Security
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"

# Async runtime
tokio = { version = "1.49", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
ring = "0.17"
rand = "0.8"

# Logging
tracing = "0.1"

# Time
chrono = "0.4"

# Concurrency
parking_lot = "0.12"

# AWS Nitro Enclaves backend
aws-config = { version = "1.5", optional = true }
aws-sdk-kms = { version = "1.60", optional = true }
aws-nitro-enclaves-cose = { version = "0.5", optional = true }

# Intel SGX backend
sgx_types = { version = "1.1", optional = true }
sgx_urts = { version = "1.1", optional = true }
sgx_tcrypto = { version = "1.1", optional = true }

# AMD SEV backend
sev = { version = "7.1", optional = true }

# Base64 encoding for attestation reports
base64 = "0.22"

# HTTP client for attestation verification
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
tokio-test = "0.4"
proptest = "1.9"
tempfile = "3.24"

[features]
default = []
aws-nitro = ["aws-config", "aws-sdk-kms", "aws-nitro-enclaves-cose", "reqwest"]
intel-sgx = ["sgx_types", "sgx_urts", "sgx_tcrypto"]
amd-sev = ["sev", "reqwest"]
all-backends = ["aws-nitro", "intel-sgx", "amd-sev"]

[[bench]]
name = "hardware_benches"
harness = false
