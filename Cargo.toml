[workspace]
resolver = "2"

members = [
    "crates/crypto-engine",
    "crates/key-manager",
    "crates/auth",
    "crates/grpc-api",
    "crates/audit",
    "crates/metrics",
    "crates/storage",
    "crates/backup",
    "crates/config",
    "crates/hsm-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HSM Development Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/hsm"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }
tokio-rustls = "0.26"

# gRPC
tonic = "0.14"
prost = "0.14"

# Cryptography
ring = "0.17"
ed25519-dalek = "2.2"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
rsa = "0.9"
aes-gcm = "0.10"
sha2 = "0.10"
sha3 = "0.10"

# TLS
rustls = "0.23"
rustls-pki-types = "1.10"
webpki = "0.22"
x509-parser = "0.18"

# Security
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.3"
sharks = "0.5"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }

# Configuration
config = "0.15"
toml = "0.9"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.19", features = ["v4", "serde"] }

# Utilities
parking_lot = "0.12"
bytes = "1.11"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
