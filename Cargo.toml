[workspace]
resolver = "2"

members = [
    "crates/crypto-engine",
    "crates/key-manager",
    "crates/auth",
    "crates/grpc-api",
    "crates/rest-api",
    "crates/audit",
    "crates/metrics",
    "crates/storage",
    "crates/backup",
    "crates/config",
    "crates/hsm-server",
    "crates/verification",
    "crates/zk-proofs",
    "crates/hardware-backend",
    "crates/pkcs11-bridge",
    "crates/secrets",
    "crates/kmip-server",
    "crates/blockchain",
    "crates/webhooks",
    "crates/validator",
    "crates/wasm-policy",
    "crates/cluster",
    "crates/bridge-monitor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HSM Development Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/hsm"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }
tokio-rustls = "0.26"

# Blockchain
bip32 = "0.5"
bip39 = { version = "2.1", features = ["rand"] }
alloy-primitives = "0.8"
alloy-rlp = "0.3"
bitcoin = { version = "0.32", features = ["std", "secp-recovery"] }
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
bs58 = "0.5"
ed25519-dalek = "2.2"
tiny-keccak = { version = "2.0", features = ["keccak"] }
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
hex = "0.4"

# HTTP client for webhooks and OIDC
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# JWT for OIDC
jsonwebtoken = "9.3"

# BigDecimal for policy limits
bigdecimal = { version = "0.4", features = ["serde"] }

# gRPC
tonic = "0.14"
prost = "0.14"

# Cryptography
ring = "0.17"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
rsa = "0.9"
aes-gcm = "0.10"
sha2 = "0.10"
sha3 = "0.10"

# TLS
rustls = "0.23"
rustls-pki-types = "1.10"
webpki = "0.22"
x509-parser = "0.18"

# Security
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.3"
sharks = "0.5"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }

# Configuration
config = "0.15"
toml = "0.9"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.19", features = ["v4", "serde"] }

# Utilities
parking_lot = "0.12"
bytes = "1.11"
dashmap = "6.1"
lru = "0.16"
tempfile = "3.19"
async-trait = "0.1"

# Testing & Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# High Availability / Clustering
openraft = "0.10"
sled = "0.34"
hkdf = "0.12"

# Bridge Monitoring
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Security patches for transitive dependencies
[patch.crates-io]
# Patch ark-relations to remove tracing-subscriber 0.2.x dependency
# which has RUSTSEC-2025-0055 (ANSI escape sequence injection in logs)
ark-relations = { path = "patches/ark-relations" }
