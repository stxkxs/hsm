[workspace]
resolver = "2"

members = [
    "crates/crypto-engine",
    "crates/key-manager",
    "crates/auth",
    "crates/grpc-api",
    "crates/rest-api",
    "crates/audit",
    "crates/metrics",
    "crates/storage",
    "crates/backup",
    "crates/config",
    "crates/hsm-server",
    "crates/verification",
    "crates/zk-proofs",
    "crates/hardware-backend",
    "crates/pkcs11-bridge",
    "crates/secrets",
    "crates/kmip-server",
    "crates/blockchain",
    "crates/webhooks",
    "crates/validator",
    "crates/wasm-policy",
    "crates/cluster",
    "crates/bridge-monitor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HSM Development Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }
tokio-rustls = "0.26"
bs58 = "0.5"
ed25519-dalek = "2.2"
hmac = "0.12"
rand = "0.8"
hex = "0.4"

# HTTP client for webhooks and OIDC
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# gRPC
tonic = "0.14"
prost = "0.14"

# Cryptography
ring = "0.17"
p256 = "0.13"
p384 = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
aes-gcm = "0.10"
sha2 = "0.10"

# TLS
rustls = "0.23"
rustls-pki-types = "1.10"
x509-parser = "0.18"

# Security
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.3"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.19", features = ["v4", "serde"] }

# Utilities
parking_lot = "0.12"
bytes = "1.11"
dashmap = "6.1"
tempfile = "3.19"

# Testing & Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
