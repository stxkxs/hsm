# Cargo audit configuration

[advisories]
# Vulnerabilities and warnings that are documented and accepted
ignore = [
    # atomic-polyfill is unmaintained but is a transitive dependency
    # from postcard -> heapless. This is a warning, not a vulnerability.
    # Postcard maintainers would need to update heapless version.
    "RUSTSEC-2023-0089",

    # RSA Marvin Attack - no fix available upstream
    # Documented in README.md under Known Vulnerabilities
    # Mitigation: Use OAEP padding instead of PKCS#1 v1.5
    "RUSTSEC-2023-0071",

    # Sharks Secret Sharing coefficient bias - no fix available upstream
    # Documented in README.md under Known Vulnerabilities
    # Mitigation: Additional randomness sources for critical splits
    "RUSTSEC-2024-0398",

    # rustls-webpki 0.101.7 advisories — transitive via aws-smithy-http-client → rustls 0.21
    # (pulled in only when the optional `aws-nitro` feature of hsm-hardware-backend is enabled).
    # No upstream fix until AWS SDK refreshes its smithy http-client stack. The HSM's own TLS
    # stack uses rustls 0.23 + rustls-webpki 0.103.13 which IS patched.
    "RUSTSEC-2026-0098",  # Name constraints incorrectly accepted for URI names
    "RUSTSEC-2026-0099",  # Name constraints accepted for wildcard certificates
    "RUSTSEC-2026-0104",  # Reachable panic in CRL parsing

    # ansi_term / atty - unmaintained, pulled in via clap 2 -> dudect-bencher (dev-dep only,
    # crypto-engine constant-time tests). Not in production binary. No upstream fix planned.
    "RUSTSEC-2021-0139",  # ansi_term is unmaintained
    "RUSTSEC-2024-0375",  # atty is unmaintained
    "RUSTSEC-2021-0145",  # atty potential unaligned read on Windows

    # instant - unmaintained, pulled in via parking_lot 0.11 -> sled (storage/cluster/validator).
    # Sled maintainers have not refreshed parking_lot. Affects only sled-backed components.
    "RUSTSEC-2024-0384",

    # rand 0.10 unsoundness when a custom global logger is installed. Pulled in via quickcheck
    # (grpc-api dev-dep only). The HSM does not install a custom rand logger, so this is
    # inert. quickcheck 1.x is not yet updated to rand 0.11+.
    "RUSTSEC-2026-0097",

    # paste - unmaintained proc-macro (RUSTSEC-2024-0436). Pulled in transitively via
    # alloy-primitives (blockchain), pqcrypto-mldsa (crypto-engine ML-DSA), and ark-ff. No
    # upstream fix: even alloy-primitives 1.x and the latest pqcrypto-mldsa still depend on
    # paste ^1.0. It is a compile-time-only proc-macro, so there is no runtime exposure.
    "RUSTSEC-2024-0436",

    # fxhash - unmaintained (RUSTSEC-2025-0057), pulled in via sled 0.34 (storage/cluster/
    # validator). Sled 0.34.x has not moved off fxhash; the only drop is on the unstable
    # sled 1.0-alpha track, which is not an acceptable bump for the slashing DB. Affects only
    # sled-backed components, not the default hsm-server binary.
    "RUSTSEC-2025-0057",

    # derivative - unmaintained proc-macro (RUSTSEC-2024-0388), pulled in via the arkworks
    # stack (ark-crypto-primitives / ark-poly-commit) used only by hsm-zk-proofs. No upstream
    # fix: even arkworks 0.6 still depends on derivative ^2.0. Not present in the default
    # hsm-server binary; compile-time-only proc-macro with no runtime exposure.
    "RUSTSEC-2024-0388",

    # serde_cbor - unmaintained (RUSTSEC-2021-0127), pulled in via aws-nitro-enclaves-cose,
    # which is compiled only when the optional `aws-nitro` feature of hsm-hardware-backend is
    # enabled (not in the default hsm-server binary). aws-nitro-enclaves-cose is at its latest
    # 0.5.2 and still depends on serde_cbor ^0.11; no upstream fix. Also noted in
    # crates/hardware-backend/Cargo.toml.
    "RUSTSEC-2021-0127",

    # pqcrypto-* family - unmaintained: the upstream PQClean project is being archived
    # (advisories published 2026-06-04). Pulled in via hsm-crypto-engine's post-quantum
    # support — pqcrypto-mlkem (ML-KEM / Kyber) and pqcrypto-mldsa (ML-DSA / Dilithium),
    # which in turn depend on pqcrypto-internals and pqcrypto-traits. These are
    # unmaintained NOTICES (no known vulnerability), not denied by `--deny unsound`. There
    # is no maintained drop-in pure-Rust replacement for NIST PQC primitives yet; the
    # RustCrypto ml-kem/ml-dsa crates are not yet a 1:1 swap for these bindings. Tracked for
    # migration when a maintained successor stabilizes.
    "RUSTSEC-2026-0161",  # pqcrypto-mlkem unmaintained
    "RUSTSEC-2026-0162",  # pqcrypto-traits unmaintained
    "RUSTSEC-2026-0163",  # pqcrypto-internals unmaintained
    "RUSTSEC-2026-0166",  # pqcrypto-mldsa unmaintained

    # proc-macro-error2 - unmaintained (RUSTSEC-2026-0173, published 2026-06-07). Pulled in
    # via validator_derive 0.20 -> validator 0.20 (used by hsm-validator). Compile-time-only
    # proc-macro helper with no runtime exposure; an unmaintained notice, not a vulnerability.
    # No upstream fix: validator 0.20 has not moved off proc-macro-error2.
    "RUSTSEC-2026-0173",
]

# Severity threshold for errors (we want to be notified of medium+ vulnerabilities)
# Options: none, low, medium, high, critical
severity_threshold = "medium"
