# Cargo audit configuration

[advisories]
# Vulnerabilities and warnings that are documented and accepted
ignore = [
    # atomic-polyfill is unmaintained but is a transitive dependency
    # from postcard -> heapless. This is a warning, not a vulnerability.
    # Postcard maintainers would need to update heapless version.
    "RUSTSEC-2023-0089",

    # RSA Marvin Attack - no fix available upstream
    # Documented in README.md under Known Vulnerabilities
    # Mitigation: Use OAEP padding instead of PKCS#1 v1.5
    "RUSTSEC-2023-0071",

    # Sharks Secret Sharing coefficient bias - no fix available upstream
    # Documented in README.md under Known Vulnerabilities
    # Mitigation: Additional randomness sources for critical splits
    "RUSTSEC-2024-0398",

    # ansi_term / atty - unmaintained, pulled in via clap 2 -> dudect-bencher (dev-dep only,
    # crypto-engine constant-time tests). Not in production binary. No upstream fix planned.
    "RUSTSEC-2021-0139",  # ansi_term is unmaintained
    "RUSTSEC-2024-0375",  # atty is unmaintained
    "RUSTSEC-2021-0145",  # atty potential unaligned read on Windows

    # instant - unmaintained, pulled in via parking_lot 0.11 -> sled (storage/cluster/validator).
    # Sled maintainers have not refreshed parking_lot. Affects only sled-backed components.
    "RUSTSEC-2024-0384",


    # paste - unmaintained proc-macro (RUSTSEC-2024-0436). Pulled in transitively via
    # alloy-primitives (blockchain) and ark-ff. No upstream fix: even alloy-primitives 1.x
    # still depends on paste ^1.0. It is a compile-time-only proc-macro, so there is no
    # runtime exposure.
    "RUSTSEC-2024-0436",

    # fxhash - unmaintained (RUSTSEC-2025-0057), pulled in via sled 0.34 (storage/cluster/
    # validator). Sled 0.34.x has not moved off fxhash; the only drop is on the unstable
    # sled 1.0-alpha track, which is not an acceptable bump for the slashing DB. Affects only
    # sled-backed components, not the default hsm-server binary.
    "RUSTSEC-2025-0057",

    # derivative - unmaintained proc-macro (RUSTSEC-2024-0388), pulled in via the arkworks
    # stack (ark-crypto-primitives / ark-poly-commit) used only by hsm-zk-proofs. No upstream
    # fix: even arkworks 0.6 still depends on derivative ^2.0. Not present in the default
    # hsm-server binary; compile-time-only proc-macro with no runtime exposure.
    "RUSTSEC-2024-0388",

    # crypto-bigint 0.5.5 timing variability in operations meant to be constant-time
    # (RUSTSEC-2026-0387). This one is REACHABLE, not inert: elliptic-curve 0.13 (under
    # k256/p256/p384 0.13, the ECDSA keys crypto-engine, key-manager, auth and blockchain
    # sign with) uses it for scalar arithmetic, and starknet-crypto 0.8 uses it for RFC 6979
    # nonce derivation in hsm-blockchain. The only patched release is crypto-bigint 0.7.6,
    # and no 0.5.x patch exists. Moving off 0.5 needs both:
    #   - the elliptic-curve 0.14 / RustCrypto trait wave, held in .github/dependabot.yml
    #     because rsa 0.9.10 (the latest stable rsa) still requires sha2/digest 0.10 and
    #     pkcs8 0.10, and the call sites cannot mix trait generations;
    #   - a starknet-crypto release on crypto-bigint 0.7 (0.8.1, the latest, requires 0.5).
    # Exposure depends on compiler and target CPU and on an attacker able to time signing.
    # Remove this entry as soon as `cargo tree -i crypto-bigint@0.5.5` comes back empty.
    "RUSTSEC-2026-0387",

    # heapless 0.7.17 - unsound advisories RUSTSEC-2026-0574 through RUSTSEC-2026-0582, fixed
    # only in heapless 0.9.4. Path: frost-core 3.0.0 takes postcard with its default features
    # for its `serialization` feature, which threshold/dkg.rs needs for the DKG package
    # encodings, and postcard's default `heapless-cas` feature pulls heapless 0.7 (postcard
    # 1.2.0 keeps that default). Inert: postcard uses heapless only for heapless::Vec in its
    # fixed-capacity serializers (to_vec, to_vec_cobs, the HVec flavor); frost-core and this
    # workspace call only postcard::to_allocvec and postcard::from_bytes, and nothing in the
    # graph calls the Deque, IndexMap, SortedLinkedList, Spsc, HistoryBuf, vec::IntoIter or
    # pool APIs the advisories name. Remove these entries as soon as
    # `cargo tree -i heapless@0.7.17` comes back empty.
    "RUSTSEC-2026-0574",  # FindMutView::pop use after free
    "RUSTSEC-2026-0575",  # Spsc::peek memory ordering
    "RUSTSEC-2026-0576",  # IndexMap::truncate inconsistent state
    "RUSTSEC-2026-0577",  # panicking Drop during clear, retain, truncate and IntoIter::drop
    "RUSTSEC-2026-0578",  # SortedLinkedList::zeroize inconsistent state
    "RUSTSEC-2026-0579",  # Deque TryFrom when full (its function range starts at 0.9.2)
    "RUSTSEC-2026-0580",  # pool Treiber stack race
    "RUSTSEC-2026-0581",  # Deque::make_contiguous broken invariants
    "RUSTSEC-2026-0582",  # IndexMap::insert at u16::MAX elements

]

# Severity threshold for errors (we want to be notified of medium+ vulnerabilities)
# Options: none, low, medium, high, critical
severity_threshold = "medium"
