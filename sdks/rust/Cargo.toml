[package]
name = "hsm-client"
version = "0.1.0"
edition = "2021"
authors = ["HSM Development Team"]
license = "MIT OR Apache-2.0"
description = "Rust SDK for HSM (Hardware Security Module)"
repository = "https://github.com/your-org/hsm"
keywords = ["hsm", "cryptography", "key-management", "security", "signing"]
categories = ["cryptography", "api-bindings"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.5"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
