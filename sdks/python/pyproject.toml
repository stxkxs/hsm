[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hsm-client"
version = "0.1.0"
description = "Python SDK for HSM (Hardware Security Module)"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    { name = "HSM Development Team" }
]
keywords = ["hsm", "cryptography", "key-management", "security", "signing", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.28.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/hsm"
Documentation = "https://github.com/your-org/hsm/tree/main/sdks/python"
Repository = "https://github.com/your-org/hsm.git"

[tool.hatch.build.targets.wheel]
packages = ["hsm_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
