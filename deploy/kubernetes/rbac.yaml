apiVersion: v1
kind: ServiceAccount
metadata:
  name: hsm-server
  namespace: hsm-system
  labels:
    app.kubernetes.io/name: hsm
    app.kubernetes.io/component: server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hsm-server
  namespace: hsm-system
  labels:
    app.kubernetes.io/name: hsm
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hsm-server
  namespace: hsm-system
  labels:
    app.kubernetes.io/name: hsm
    app.kubernetes.io/component: server
subjects:
  - kind: ServiceAccount
    name: hsm-server
    namespace: hsm-system
roleRef:
  kind: Role
  name: hsm-server
  apiGroup: rbac.authorization.k8s.io
