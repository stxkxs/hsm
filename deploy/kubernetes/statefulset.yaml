apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hsm-server
  namespace: hsm-system
  labels:
    app.kubernetes.io/name: hsm
    app.kubernetes.io/component: server
spec:
  serviceName: hsm-server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hsm
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hsm
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hsm-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hsm-server
          image: hsm-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--tls-cert=/tls/tls.crt"
            - "--tls-key=/tls/tls.key"
            # Client-auth CA: enables mandatory mTLS. Without it the server
            # refuses to start (unless HSM_ALLOW_INSECURE_TRANSPORT is set).
            - "--tls-ca=/tls/ca.crt"
            # Master key sourced from a mounted file (not the environment), so it
            # is not visible via /proc or inherited by child processes.
            - "--master-key-file=/secrets/master-key/HSM_MASTER_KEY"
          envFrom:
            - configMapRef:
                name: hsm-config
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            - name: master-key
              mountPath: /secrets/master-key
              readOnly: true
            - name: hsm-data
              mountPath: /data/hsm
          # Liveness uses the shallow /live probe: only restart the pod if the
          # process/runtime is actually wedged, not when a backend dependency is
          # temporarily degraded (that is readiness' job).
          livenessProbe:
            httpGet:
              path: /live
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness uses the deep /health probe: a degraded subsystem returns
          # 503 and the pod is removed from service endpoints (not killed).
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls-certs
          secret:
            secretName: hsm-tls
        - name: master-key
          secret:
            secretName: hsm-master-key
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: hsm-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
